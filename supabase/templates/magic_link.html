<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#0b0c10;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0c10;padding:32px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#14161c;border:1px solid #262a35;border-radius:16px;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:#e8eaf0;">
            <tr>
              <td style="padding:28px 28px 0;">
                <span style="display:inline-block;background:#7c5cff;color:#ffffff;font-weight:700;font-size:18px;padding:8px 14px;border-radius:10px;">&#9654; CutVid</span>
              </td>
            </tr>
            <tr>
              <td style="padding:22px 28px 0;">
                <h1 style="margin:0 0 10px;font-size:22px;line-height:1.3;color:#ffffff;">Your sign-in code</h1>
                <p style="margin:0;font-size:15px;line-height:1.6;color:#b9bdc9;">Enter this code in CutVid to finish signing in. It expires soon and can be used once.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 28px;">
                <div style="background:#0b0c10;border:1px solid #262a35;border-radius:12px;padding:18px;text-align:center;font-family:'SFMono-Regular',Menlo,Consolas,monospace;font-size:32px;font-weight:700;letter-spacing:8px;color:#ffffff;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 28px;">
                <p style="margin:0;font-size:12.5px;line-height:1.6;color:#8b90a0;border-top:1px solid #262a35;padding-top:16px;">Never share this code with anyone. If you didn't request this, you can safely ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
