<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>CutVid – Sign in</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #0b0c10; color: #e8eaf0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
      main { width: min(420px, 100%); background: #14161c; border: 1px solid #262a35; border-radius: 16px; padding: 28px; text-align: center; }
      img.logo { border-radius: 14px; }
      h1 { font-size: 21px; margin: 14px 0 6px; }
      p { color: #8b90a0; margin: 0 0 16px; }
      form { display: flex; flex-direction: column; gap: 10px; text-align: start; }
      label { font-size: 14px; color: #8b90a0; display: flex; flex-direction: column; gap: 4px; }
      input { font: inherit; color: #e8eaf0; background: #0b0c10; border: 1px solid #262a35; border-radius: 10px; padding: 11px 12px; direction: ltr; }
      input:focus { outline: none; border-color: #7c5cff; }
      button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 13px 20px; cursor: pointer; width: 100%; }
      .primary { background: #7c5cff; color: #fff; }
      .secondary { background: #1d2029; color: #e8eaf0; border: 1px solid #262a35; display: flex; align-items: center; justify-content: center; gap: 8px; }
      .ghost { background: transparent; color: #8b90a0; }
      .or { display: flex; align-items: center; gap: 10px; color: #8b90a0; font-size: 13px; margin: 12px 0; }
      .or::before, .or::after { content: ''; flex: 1; height: 1px; background: #262a35; }
      .app { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 6px 0 14px; }
      .app img { width: 56px; height: 56px; border-radius: 14px; }
      .arrow { color: #8b90a0; font-size: 22px; }
      ul { text-align: start; background: #0b0c10; border: 1px solid #262a35; border-radius: 12px; padding: 12px 34px 12px 14px; margin: 0 0 16px; color: #c9ccd6; }
      .who { font-size: 14px; color: #8b90a0; margin-bottom: 14px; direction: ltr; }
      .err { color: #ff5c7a; min-height: 20px; font-size: 14px; }
      .actions { display: flex; flex-direction: column; gap: 8px; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="/icon.svg" width="64" height="64" alt="" />
      <div id="loading"><h1>טוען…</h1></div>

      <!-- Step 1: sign in to CutVid -->
      <section id="login" hidden>
        <h1>התחבר עם CutVid</h1>
        <p id="login-sub">היכנס לחשבון ה-CutVid שלך כדי להמשיך</p>
        <button class="secondary" id="google" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3z" fill="#4285f4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0012 22z" fill="#34a853"/><path d="M6.4 14a6 6 0 010-3.9V7.4H3.1a10 10 0 000 9.2z" fill="#fbbc05"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 003.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6z" fill="#ea4335"/></svg>
          המשך עם Google
        </button>
        <div class="or">או</div>
        <form id="form">
          <label>אימייל<input id="email" type="email" autocomplete="email" required /></label>
          <label>סיסמה<input id="password" type="password" autocomplete="current-password" required /></label>
          <div class="err" id="login-err"></div>
          <button class="primary" type="submit" id="submit">התחבר</button>
        </form>
      </section>

      <!-- Step 2: consent -->
      <section id="consent" hidden>
        <div class="app"><img src="/icon.svg" alt="" /><span class="arrow">⇄</span><img id="client-logo" alt="" hidden /><b id="client-initial" hidden></b></div>
        <h1><span id="client-name">אפליקציה</span> מבקשת להתחבר עם CutVid</h1>
        <div class="who" id="who"></div>
        <p>האפליקציה תקבל:</p>
        <ul id="scopes"></ul>
        <div class="err" id="consent-err"></div>
        <div class="actions">
          <button class="primary" id="approve">אשר</button>
          <button class="ghost" id="deny">בטל</button>
          <button class="ghost" id="switch">זה לא אני — החלף חשבון</button>
        </div>
      </section>

      <section id="error" hidden>
        <h1>משהו השתבש</h1>
        <p class="err" id="error-text"></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
    <script>
      // CutVid OAuth 2.1 consent screen (Supabase Auth OAuth server, authorization path /oauth/consent).
      // Other apps (e.g. SpaceShip) send users to <project>/auth/v1/oauth/authorize; Supabase redirects
      // here with ?authorization_id=…; the user signs in to CutVid and approves; Supabase then
      // redirects back to the app's registered redirect_uri with an authorization code.
      (function () {
        var SUPABASE_URL = 'https://btrwboxwbinqewgvlcal.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_g2aYTfsQhep44Ta1VIIJfQ_GQnA5ODh';
        var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true } });
        var $ = function (id) { return document.getElementById(id); };
        var params = new URLSearchParams(location.search);
        var authId = params.get('authorization_id');
        var SCOPES = { openid: 'זיהוי החשבון שלך', email: 'כתובת האימייל שלך', profile: 'השם ותמונת הפרופיל שלך' };

        function show(id) { ['loading', 'login', 'consent', 'error'].forEach(function (s) { $(s).hidden = s !== id; }); }
        function fail(msg) { $('error-text').textContent = msg; show('error'); }
        if (!authId) return fail('חסר מזהה בקשה. התחל את ההתחברות מתוך האפליקציה.');

        async function start() {
          var s = await sb.auth.getSession();
          if (!s.data.session) return show('login');
          var r = await sb.auth.oauth.getAuthorizationDetails(authId);
          if (r.error) return fail(r.error.message || 'הבקשה פגה. נסה שוב מתוך האפליקציה.');
          var d = r.data;
          if (d.redirect_url && !d.authorization_id) { location.replace(d.redirect_url); return; } // already approved before
          var name = (d.client && (d.client.client_name || d.client.name)) || 'אפליקציה';
          $('client-name').textContent = name;
          var logo = d.client && (d.client.logo_uri || d.client.logo_url);
          if (logo) { $('client-logo').src = logo; $('client-logo').hidden = false; }
          $('who').textContent = 'מחובר בתור ' + (s.data.session.user.email || '');
          var scopes = String(d.scope || 'email').split(/\s+/).filter(Boolean);
          $('scopes').innerHTML = '';
          scopes.forEach(function (sc) { var li = document.createElement('li'); li.textContent = SCOPES[sc] || sc; $('scopes').appendChild(li); });
          show('consent');
        }

        $('form').addEventListener('submit', async function (e) {
          e.preventDefault();
          $('submit').disabled = true; $('login-err').textContent = '';
          var r = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
          $('submit').disabled = false;
          if (r.error) { $('login-err').textContent = 'האימייל או הסיסמה לא נכונים'; return; }
          start();
        });
        $('google').addEventListener('click', function () {
          sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname + '?authorization_id=' + encodeURIComponent(authId) } });
        });
        async function decide(approve) {
          $('approve').disabled = $('deny').disabled = true; $('consent-err').textContent = '';
          var r = approve ? await sb.auth.oauth.approveAuthorization(authId, { skipBrowserRedirect: true })
                          : await sb.auth.oauth.denyAuthorization(authId, { skipBrowserRedirect: true });
          if (r.error || !r.data || !r.data.redirect_url) {
            $('approve').disabled = $('deny').disabled = false;
            $('consent-err').textContent = (r.error && r.error.message) || 'לא הצלחנו להשלים את הבקשה';
            return;
          }
          location.replace(r.data.redirect_url);
        }
        $('approve').addEventListener('click', function () { decide(true); });
        $('deny').addEventListener('click', function () { decide(false); });
        $('switch').addEventListener('click', async function () { await sb.auth.signOut(); show('login'); });

        // Returning from Google: wait for supabase-js to finish exchanging the ?code= in the URL.
        if (params.get('code')) {
          sb.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_IN') { history.replaceState(null, '', location.pathname + '?authorization_id=' + encodeURIComponent(authId)); start(); } });
          setTimeout(start, 2500);
        } else start();
      })();
    </script>
  </body>
</html>
