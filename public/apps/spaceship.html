<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpaceShip – אפליקציה רשמית של CutVid</title>
    <style>
      body { margin: 0; min-height: 100vh; background: #0b0c10; color: #e8eaf0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; display: grid; place-items: center; padding: 20px; box-sizing: border-box; }
      main { width: min(440px, 100%); background: #14161c; border: 1px solid #262a35; border-radius: 16px; padding: 28px; text-align: center; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 12px 0 4px; display: inline-flex; align-items: center; gap: 8px; }
      .badge { display: inline-flex; align-items: center; gap: 6px; background: rgba(29, 155, 240, .14); color: #7cc4ff; border: 1px solid rgba(29, 155, 240, .45); border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
      p { color: #8b90a0; }
    </style>
  </head>
  <body>
    <main>
      <img src="/apps/spaceship.png" alt="" />
      <h1>SpaceShip <svg width="24" height="24" viewBox="0 0 24 24" aria-label="מאומת"><circle cx="12" cy="12" r="11" fill="#1d9bf0"/><path d="M7 12.5l3.2 3.2L17.2 8.8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></h1>
      <div><span class="badge">אפליקציה רשמית של CutVid</span></div>
      <p id="confirmed" hidden style="color:#4ade80;font-weight:700">✓ האימייל אושר! חזור ל-SpaceShip ולחץ "אישרתי".<br>Email confirmed! Go back to SpaceShip and tap "I confirmed".</p>
      <p>משחק יריות בחלל: חלליות, מטאורים, שלבים, חנות ומשחק עם חברים. אפשר להתחבר אליו עם חשבון ה-CutVid שלך.</p>
    </main>
    <script>if (/[?&]confirmed=1/.test(location.search) || /access_token|type=signup/.test(location.hash)) document.getElementById('confirmed').hidden = false;</script>
  </body>
</html>
