name: Build apps

# Produces installable files for every platform as workflow artifacts.
# Pushing a tag like v1.0.0 additionally publishes them as a GitHub Release.
on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional: bake the Supabase project into the apps (Settings → Secrets and variables → Actions).
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-web, path: dist, if-no-files-found: error }

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CutVid-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-android, path: CutVid-android.apk, if-no-files-found: error }

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-windows, path: release/*.exe, if-no-files-found: error }

  mac:
    name: macOS (DMG)
    runs-on: macos-latest
    env:
      # Unsigned build. Add signing certificates as secrets to notarise for distribution.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-mac, path: release/*.dmg, if-no-files-found: error }

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build (no code signing)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then CONTAINER="-workspace App.xcworkspace"; else CONTAINER="-project App.xcodeproj"; fi
          xcodebuild $CONTAINER -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr CutVid-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-ios, path: CutVid-ios-unsigned.ipa, if-no-files-found: error }

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, mac, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true, pattern: 'CutVid-{android,windows,mac,ios}' }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
