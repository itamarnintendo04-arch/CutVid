name: Build apps

# Produces installable files for every platform as workflow artifacts.
# Each run also publishes a release page with direct download links (Releases tab).
on:
  push:
    branches: [main, 'claude/**']
    # Docs and Supabase-only changes do not need new app builds (macOS minutes are expensive).
    paths-ignore: ['supabase/**', '**.md', 'vercel.json']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Optional: bake the Supabase project into the apps (Settings → Secrets and variables → Actions).
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Optional: public URL of the hosted web app; enables the /auth.html return-to-app page (Settings → Variables).
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

jobs:
  web:
    name: Web / PWA
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-web, path: dist, if-no-files-found: error }

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/patch-native.mjs
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk CutVid-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-android, path: CutVid-android.apk, if-no-files-found: error }

  windows:
    name: Windows (EXE)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-windows, path: release/*.exe, if-no-files-found: error }

  mac:
    name: macOS (DMG)
    runs-on: macos-latest
    env:
      # Unsigned build. Add signing certificates as secrets to notarise for distribution.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-mac, path: release/*.dmg, if-no-files-found: error }

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: node scripts/patch-native.mjs
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build (no code signing)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then CONTAINER="-workspace App.xcworkspace"; else CONTAINER="-project App.xcodeproj"; fi
          xcodebuild $CONTAINER -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr CutVid-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with: { name: CutVid-ios, path: CutVid-ios-unsigned.ipa, if-no-files-found: error }

  release:
    name: Publish downloads
    # Every build gets its own release page with direct download links, even if one platform failed.
    if: ${{ !cancelled() }}
    needs: [android, windows, mac, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: CutVid-android, path: artifacts }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: CutVid-ios, path: artifacts }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: CutVid-windows, path: artifacts }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: CutVid-mac, path: artifacts }
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('CutVid build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          make_latest: true
          fail_on_unmatched_files: true
          files: artifacts/*
          body: |
            Direct downloads:
            - **iPhone / iPad** – `CutVid-ios-unsigned.ipa` (install with Sideloadly or AltStore)
            - **Android** – `CutVid-android.apk`
            - **Windows** – `CutVid-*-setup.exe` or `CutVid-*-portable.exe`
            - **macOS** – `CutVid-*-mac-arm64.dmg` (Apple Silicon) or `CutVid-*-mac-x64.dmg` (Intel)
