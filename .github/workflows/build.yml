name: Build apps

# Builds every platform and attaches the files straight to a release page (Releases tab).
# Files go to the release rather than to workflow artifacts: release files do not count against
# the Actions storage quota, which large Electron builds used to fill up.
on:
  push:
    # Only main builds apps: building every branch too would spend the monthly Actions minutes twice.
    branches: [main]
    # Docs and Supabase-only changes do not need new app builds (macOS minutes are expensive).
    paths-ignore: ['supabase/**', '**.md', 'vercel.json', 'site/**']
    tags: ['v*']
  # Actions → Build apps → Run workflow: enter a version (e.g. 1.0.0) to publish an official release "CutVid v1.0.0".
  workflow_dispatch:
    inputs:
      version:
        description: Release version, e.g. 1.0.0 (leave empty for a normal numbered build)
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Optional: bake the Supabase project into the apps (Settings → Secrets and variables → Actions).
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
  # Optional: public URL of the hosted web app; enables the /callback return-to-app page (Settings → Variables).
  VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
  TAG: ${{ inputs.version != '' && inputs.version != null && format('v{0}', inputs.version) || startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
  RELEASE_NAME: ${{ inputs.version != '' && inputs.version != null && format('CutVid v{0}', inputs.version) || startsWith(github.ref, 'refs/tags/v') && format('CutVid {0}', github.ref_name) || format('CutVid build {0}', github.run_number) }}

jobs:
  # Creates the release first (as a prerelease, so the website's "latest" links keep pointing at
  # the previous complete build until this one is finished).
  prepare:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      # A pushed commit whose message contains [release] publishes an official release named after
      # package.json's version (v1.0.0 → "CutVid v1.0.0") instead of a numbered build.
      - id: v
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [[ "$MSG" == *"[release]"* ]]; then
            ver="$(node -p "require('./package.json').version")"
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"
            echo "name=CutVid v$ver" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "name=$RELEASE_NAME" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          body: |
            Direct downloads:
            - **iPhone / iPad** – `CutVid-ios-unsigned.ipa` (install with Sideloadly or AltStore)
            - **iPad (computer layout)** – `CutVid-Pad-unsigned.ipa` – CutVid Pad
            - **Android tablet (computer layout)** – `CutVid-Pad-android.apk` – CutVid Pad
            - **Android** – `CutVid-android.apk`
            - **Windows** – `CutVid-setup.exe` or `CutVid-portable.exe`
            - **macOS** – `CutVid-mac-arm64.dmg` (Apple Silicon) or `CutVid-mac-x64.dmg` (Intel)

  web:
    name: Web build check
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build

  # CutVid (phones) and CutVid Pad (tablets: always the computer layout, app ID com.cutvid.pad).
  android:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'Android (APK)', pad: '', file: CutVid-android.apk }
          - { label: 'Android tablet – CutVid Pad (APK)', pad: '1', file: CutVid-Pad-android.apk }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CUTVID_PAD: ${{ matrix.pad }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/patch-native.mjs
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --android
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ matrix.file }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ matrix.file }}
          fail_on_unmatched_files: true

  windows:
    name: Windows (EXE)
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release/*.exe
          fail_on_unmatched_files: true

  mac:
    name: macOS (DMG)
    needs: prepare
    runs-on: macos-latest
    env:
      # Unsigned build. Add signing certificates as secrets to notarise for distribution.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:mac
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: release/*.dmg
          fail_on_unmatched_files: true

  # Two apps from the same code: CutVid (iPhone + iPad, phone layout on small screens) and
  # CutVid Pad (iPad only, always the computer layout, bundle ID com.cutvid.pad).
  ios:
    name: ${{ matrix.label }}
    needs: prepare
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'iOS (unsigned IPA)', pad: '', file: CutVid-ios-unsigned.ipa }
          - { label: 'iPad – CutVid Pad (unsigned IPA)', pad: '1', file: CutVid-Pad-unsigned.ipa }
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CUTVID_PAD: ${{ matrix.pad }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: node scripts/patch-native.mjs
      - name: App icons
        continue-on-error: true
        run: npx --yes @capacitor/assets generate --ios
      - run: npx cap sync ios
      - name: Build (no code signing)
        run: |
          cd ios/App
          if [ -d App.xcworkspace ]; then CONTAINER="-workspace App.xcworkspace"; else CONTAINER="-project App.xcodeproj"; fi
          xcodebuild $CONTAINER -scheme App -configuration Release -sdk iphoneos \
            -derivedDataPath "$PWD/build" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr "${{ matrix.file }}" Payload
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: ${{ matrix.file }}
          fail_on_unmatched_files: true

  # Once every platform succeeded, the release becomes the one the website's download links use.
  publish:
    name: Publish downloads
    needs: [prepare, android, windows, mac, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: false
          make_latest: true
